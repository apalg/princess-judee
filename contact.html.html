<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Contact Us</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    background: linear-gradient(135deg, #d6d6d6, #f4f4f4);
    color:#222;
}

/* HEADER */
header{
    background: linear-gradient(to right, #7b0000, #b30000);
    color:white;
    text-align:center;
    padding:25px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

/* NAV */
nav{
    background:#3f3f3f;
    padding:12px;
    text-align:center;
    box-shadow:0 3px 8px rgba(0,0,0,0.2);
}

nav a{
    color:white;
    margin:0 15px;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

nav a:hover{
    color:#ffb3b3;
}

/* CONTAINER */
.container{
    padding:30px;
    max-width:1000px;
    margin:auto;
}

/* GRID */
.contact-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

/* CARD */
.card{
    background: rgba(255,255,255,0.88);
    padding:25px;
    border-radius:18px;

    border-left:6px solid #8b0000;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);

    transition:0.3s;
}

.card:hover{
    transform: translateY(-6px);
    box-shadow:0 12px 25px rgba(139,0,0,0.25);
}

/* TITLES */
.card h2{
    color:#8b0000;
}

/* FORM */
input, textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:10px;
    outline:none;
}

/* BUTTON */
button{
    background:#8b0000;
    color:white;
    padding:12px;
    border:none;
    border-radius:10px;
    width:100%;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    background:#b30000;
}

/* MAP */
.map-container iframe{
    width:100%;
    height:260px;
    border:0;
    border-radius:12px;
}

/* POPUP */
#popup{
    position:fixed;
    top:20px;
    right:20px;
    background:#2e7d32;
    color:white;
    padding:15px 20px;
    border-radius:10px;
    display:none;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* FLOATING BUTTONS */
.floating{
    position:fixed;
    bottom:20px;
    right:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.floating a{
    text-decoration:none;
    background:#25D366;
    color:white;
    padding:12px 15px;
    border-radius:50px;
    font-weight:bold;
}

.floating a.call{
    background:#8b0000;
}

/* RESPONSIVE */
@media(max-width:768px){
    .contact-grid{
        grid-template-columns:1fr;
    }
}

</style>

</head>

<body>

<header>
<h1>Contact Us</h1>
</header>

<nav>
<a href="index (1).html">Home</a>
<a href="about.html">About</a>
<a href="services.html">Services</a>
<a href="news.html">News</a>
<a href="contact.html">Contact</a>
</nav>

<div class="container">

<div class="contact-grid">

<!-- FORM -->
<div class="card">
<h2>Send Message</h2>

<form id="contactForm">
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email Address" required>
    <textarea rows="6" placeholder="Write your message..." required></textarea>
    <button type="submit">Send Message</button>
</form>

</div>

<!-- ADDRESS + MAP -->
<div class="card">
<h2>Barangay Address</h2>

<p>
Barangay Bagacay<br>
Passi City, Iloilo, Philippines
</p>

<h2>Location Map</h2>

<div class="map-container">
<iframe 
src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7828.972625930005!2d122.6153188!3d11.15158365!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x33af134d490866d5%3A0x919f2e14922a2c72!2sBagacay%2C%20Passi%20City%2C%20Iloilo!5e0!3m2!1sen!2sph!4v1779788044745!5m2!1sen!2sph"
allowfullscreen=""
loading="lazy">
</iframe>
</div>

</div>

</div>

</div>

<!-- POPUP -->
<div id="popup">Message Sent Successfully ✅</div>

<!-- FLOATING BUTTONS -->
<div class="floating">
<a href="https://m.me/" target="_blank">💬 Messenger</a>
<a href="tel:09123456789" class="call">📞 Call</a>
</div>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e){
    e.preventDefault();

    document.getElementById("popup").style.display = "block";

    setTimeout(()=>{
        document.getElementById("popup").style.display = "none";
    }, 3000);

    this.reset();
});
</script>

</body>
</html>
